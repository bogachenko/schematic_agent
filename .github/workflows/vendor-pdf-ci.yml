name: Python tests and vendor PDF smoke tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + Schneider/Eaton PDF smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCHNEIDER_PDF: .ci-data/schneider-masterclad.pdf
      EATON_PDF: .ci-data/eaton-vacclad-w.pdf
      TEST_RESULTS_DIR: .ci-results

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run complete pytest suite
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          python -m pytest -q \
            --junitxml="$TEST_RESULTS_DIR/pytest-junit.xml" \
            | tee "$TEST_RESULTS_DIR/pytest.log"

      - name: Download manufacturer reference PDFs
        shell: bash
        run: |
          mkdir -p .ci-data "$TEST_RESULTS_DIR"

          curl --fail --location --http1.1 --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 240 \
            --user-agent "schematic-agent-ci/1.0" \
            "https://productinfo.se.com/masterclad_mv_switchgear_ib/6055-40-27-kv-metal-clad-switchgear-instruction-bulletin/English/6055-40%20Masterclad%20MV%20Switchgear%20Indoor%20%28bookmap%29.pdf" \
            --output "$SCHNEIDER_PDF"

          if ! curl --fail --location --http1.1 --retry 1 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 45 \
            --user-agent "schematic-agent-ci/1.0" \
            "https://www.eaton.com/content/dam/eaton/products/design-guides---consultant-audience/eaton-vacclad-w-5-15kv-metal-clad-medium-voltage-switchgear-design-guide-dg022001en.pdf" \
            --output "$EATON_PDF"; then
            rm -f "$EATON_PDF"
            wget --timeout=30 --tries=2 --user-agent="schematic-agent-ci/1.0" \
              --output-document="$EATON_PDF" \
              "https://www.eaton.com/content/dam/eaton/products/design-guides---consultant-audience/eaton-vacclad-w-5-15kv-metal-clad-medium-voltage-switchgear-design-guide-dg022001en.pdf"
          fi

          python - <<'PY'
          import os
          from pathlib import Path

          for name in ("SCHNEIDER_PDF", "EATON_PDF"):
              path = Path(os.environ[name])
              data = path.read_bytes()
              if len(data) < 100_000 or not data.startswith(b"%PDF-"):
                  raise SystemExit(f"Invalid PDF download: {path} ({len(data)} bytes)")
              print(f"{path.name}: {len(data):,} bytes")
          PY

      - name: Run real-PDF parser smoke tests
        run: |
          python scripts/smoke_test_vendor_pdfs.py \
            --schneider "$SCHNEIDER_PDF" \
            --eaton "$EATON_PDF" \
            --report "$TEST_RESULTS_DIR/vendor-pdf-smoke.json"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-pdf-ci-reports-${{ github.run_id }}
          path: .ci-results/
          if-no-files-found: warn
          retention-days: 14
